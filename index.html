<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a44" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>워십밴드연습툴 · 악보 보기</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <!-- 앱 화면: 위 머리줄과 아래 연습 막대는 고정, 가운데 악보 칸만 스크롤 -->
    <header class="appbar">
      <div class="appbar-title">
        <h1 id="title">워십밴드연습툴 <small>연습 (P2 시험판)</small></h1>
        <p id="subtitle" class="appbar-sub" hidden></p>
      </div>
      <label class="open open-sm" title="악보 파일 열기">
        열기
        <input id="file" type="file" />
      </label>
    </header>
    <main id="out" class="stage">
      <section class="empty">
        <p>MuseScore에서 저장한 <b>.mscz</b> 파일을 열면 악보를 보여주고, 파트별로 소리를 켜고 끄며 연습할 수 있습니다. 파일은 이 기기 안에서만 읽고 어디에도 올리지 않습니다.</p>
        <label class="open" for="file">악보 파일 열기</label>
      </section>
    </main>
    <footer id="practice" class="practice" hidden></footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
