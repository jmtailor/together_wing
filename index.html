<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>워십밴드연습툴 · 악보 보기</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <!-- 앱 화면: 곡 정보 · 송폼 · 악보(4줄) · 믹서 · 추가 기능, 맨 아래 재생 막대 고정 -->
    <div class="app">
      <header class="songinfo">
        <div class="songinfo-top">
          <h1 id="title">워십밴드연습툴</h1>
          <label class="open open-sm" title="악보 파일 열기">
            열기
            <input id="file" type="file" />
          </label>
        </div>
        <dl id="meta" class="meta" hidden>
          <div><dt>작사</dt><dd data-k="lyricist">-</dd></div>
          <div><dt>작곡</dt><dd data-k="composer">-</dd></div>
          <div><dt>레퍼런스</dt><dd><input data-k="reference" class="meta-in" placeholder="버전 입력" /></dd></div>
          <div><dt>템포</dt><dd data-k="tempo">-</dd></div>
        </dl>
      </header>

      <section id="songform-card" class="card songform" hidden>
        <label for="songform" class="card-label">송폼</label>
        <textarea id="songform" rows="2" placeholder="예: Intro - V1 - PC - C - Int - V2 - PC - C - B - C - C - Outro"></textarea>
      </section>

      <main id="out" class="stage">
        <section class="empty">
          <p>MuseScore에서 저장한 <b>.mscz</b> 파일을 열면 악보를 보여주고, 파트별로 소리를 켜고 끄며 연습할 수 있습니다. 파일은 이 기기 안에서만 읽고 어디에도 올리지 않습니다.</p>
          <label class="open" for="file">악보 파일 열기</label>
        </section>
      </main>

      <section id="practice" class="card practice" hidden></section>

      <section id="extras" class="card extras" hidden>
        <span class="card-label">추가 기능</span>
        <p class="extras-hint">구간 반복, 메트로놈 등 새 기능이 들어갈 자리</p>
      </section>
    </div>
    <footer id="transport-bar" class="transport-bar" hidden></footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
